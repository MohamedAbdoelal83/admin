<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم متجر بُعد | إضافة منتج</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #131b2e;
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(139, 92, 246, 0.2);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .admin-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h2 { margin-bottom: 1.5rem; text-align: center; color: var(--accent-cyan); }
        .form-group { margin-bottom: 1.2rem; display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.9rem; color: var(--text-muted); }
        input, textarea {
            padding: 0.8rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: white;
            font-size: 1rem;
        }
        input[type="file"] { padding: 0.5rem; cursor: pointer; }
        .submit-btn {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            color: white;
            border: none;
            padding: 0.9rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
            transition: 0.3s;
        }
        .submit-btn:hover { opacity: 0.9; transform: scale(1.02); }
        .back-link { display: block; text-align: center; margin-top: 1.5rem; color: var(--text-muted); text-decoration: none; }
        .back-link:hover { color: var(--accent-cyan); }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>إضافة منتج جديد لـ "بُعد"</h2>
        <div class="form-group">
            <label>اسم المنتج</label>
            <input type="text" id="prodName" placeholder="مثال: مجسم هرمي 3D">
        </div>
        <div class="form-group">
            <label>السعر (ج.م)</label>
            <input type="number" id="prodPrice" placeholder="مثال: 150">
        </div>
        <div class="form-group">
            <label>الوصف</label>
            <textarea id="prodDesc" rows="3" placeholder="وصف قصير للمنتج..."></textarea>
        </div>
        <div class="form-group">
            <label>صورة المنتج (من استوديو الموبايل)</label>
            <input type="file" id="prodImage" accept="image/*">
        </div>
        <button class="submit-btn" onclick="uploadProduct()">نشر المنتج للمتجر</button>
        <a href="index.html" class="back-link">← العودة للمتجر الرئيسي</a>
    </div>

    <script>
        // إعدادات Supabase الخاصة بك
        const SUPABASE_URL = 'https://lrtliudkfracubpkbuhm.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_-HEpvKoPL40CxNyDDQCE8A_tvVmIpTR';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function uploadProduct() {
            const name = document.getElementById('prodName').value;
            const price = document.getElementById('prodPrice').value;
            const description = document.getElementById('prodDesc').value;
            const imageFile = document.getElementById('prodImage').files[0];

            if (!name || !price || !imageFile) {
                alert('الرجاء إدخال اسم المنتج، السعر، واختيار صورة!');
                return;
            }

            alert('جاري رفع الصورة وإضافة المنتج...');

            try {
                // 1. رفع الصورة إلى Supabase Storage (يجب عمل Bucket باسم 'products-images' في سوبابيس مرة واحدة)
                const fileExt = imageFile.name.split('.').pop();
                const fileName = `${Date.now()}.${fileExt}`;
                const filePath = `${fileName}`;

                const { data: uploadData, error: uploadError } = await _supabase.storage
                    .from('products-images')
                    .upload(filePath, imageFile);

                if (uploadError) {
                    throw uploadError;
                }

                // 2. جلب الرابط العام للصورة المرفوعة
                const { data: urlData } = _supabase.storage
                    .from('products-images')
                    .getPublicUrl(filePath);

                const imageUrl = urlData.publicUrl;

                // 3. حفظ بيانات المنتج في جدول products
                const { error: dbError } = await _supabase.from('products').insert([
                    { name: name, price: parseFloat(price), description: description, image: imageUrl }
                ]);

                if (dbError) {
                    throw dbError;
                }

                alert('تم إضافة المنتج بنجاح وأصبح ظاهراً في المتجر!');
                document.getElementById('prodName').value = '';
                document.getElementById('prodPrice').value = '';
                document.getElementById('prodDesc').value = '';
                document.getElementById('prodImage').value = '';

            } catch (error) {
                console.error(error);
                alert('حدث خطأ تأكد من إنشاء Bucket باسم products-images في Storage أولاً.');
            }
        }
    </script>
</body>
</html>
